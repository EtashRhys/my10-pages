<script>
(function () {
  var status = document.getElementById('status');
  window.radioViz = { playing: false, analyser: null, mode: 'idle', current: null };
  var instances = [];
  var playingInstance = null;

  function setViz(mode, playing, analyser) {
    window.radioViz.mode = mode;
    window.radioViz.playing = playing;
    window.radioViz.analyser = (mode === 'sync') ? analyser : null;
  }
  function stopAllAudio() {
    for (var i = 0; i < instances.length; i++) instances[i].stop();
    playingInstance = null;
    window.radioViz.current = null;
    setViz('idle', false, null);
  }
  window.jlStopAudio = stopAllAudio;

  function makeAudio(btnEl) {
    var stream = btnEl.getAttribute('data-stream');
    var displayName = btnEl.getAttribute('data-name');
    var audio = new Audio();
    audio.preload = 'none';
    var audioCtx = null, analyser = null, audioElHasGraph = false;
    var vizMode = 'idle';
    var syncState = 'unknown';
    var clickToken = 0;
    var fellBackToken = -1;
    var isCurrent = false;

    function stop() {
      try { audio.pause(); } catch (e) {}
      audio.removeAttribute('src');
      try { audio.load(); } catch (e) {}
      btnEl.classList.remove('playing');
      isCurrent = false;
      try { if (window.__my10track) window.__my10track.mediaStop(displayName); } catch (e) {}
    }
    function onStarted() {
      btnEl.classList.add('playing');
      status.textContent = 'Now playing: ' + displayName;
      try { if (window.__my10track) window.__my10track.mediaStart(displayName); } catch (e) {}
    }
    function startPlain() {
      audio.removeAttribute('crossorigin');
      audio.src = stream;
      var p = audio.play();
      if (p && p.then) {
        p.then(function () { setViz('plain', true, null); onStarted(); }).catch(function () {
          status.textContent = 'Could not start ' + displayName;
          stopAllAudio();
        });
      } else { setViz('plain', true, null); onStarted(); }
    }
    function fallbackToPlain(token) {
      if (token !== clickToken || token === fellBackToken) return;
      fellBackToken = token;
      syncState = 'plain';
      try { audio.pause(); } catch (e) {}
      audio.removeAttribute('src');
      try { audio.load(); } catch (e) {}
      audio = new Audio();
      audio.preload = 'none';
      audioElHasGraph = false;
      bindError(audio);
      status.textContent = 'Connecting to ' + displayName + '\u2026';
      startPlain();
    }
    function bindError(el) {
      el.addEventListener('error', function () {
        if (!isCurrent) return;
        if (vizMode === 'sync' && syncState !== 'sync') {
          fallbackToPlain(clickToken);
        } else {
          status.textContent = 'Stream failed to load';
          stopAllAudio();
        }
      });
    }
    bindError(audio);
    function attemptSync() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (!analyser) analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        if (!audioElHasGraph) {
          var src = audioCtx.createMediaElementSource(audio);
          src.connect(analyser);
          analyser.connect(audioCtx.destination);
          audioElHasGraph = true;
        }
        if (audioCtx.resume) audioCtx.resume();
      } catch (e) {
        syncState = 'plain';
        startPlain();
        return;
      }
      var token = clickToken;
      audio.crossOrigin = 'anonymous';
      audio.src = stream;
      var p = audio.play();
      if (p && p.then) {
        p.then(function () {
          syncState = 'sync';
          vizMode = 'sync';
          setViz('sync', true, analyser);
          onStarted();
        }).catch(function () {
          if (syncState !== 'sync') fallbackToPlain(token);
          else { status.textContent = 'Could not start ' + displayName; stopAllAudio(); }
        });
      } else {
        syncState = 'sync';
        vizMode = 'sync';
        setViz('sync', true, analyser);
        onStarted();
      }
    }
    btnEl.addEventListener('click', function () {
      if (window.jlPauseVideos) window.jlPauseVideos();
      if (window.jlRevertCards) window.jlRevertCards();
      if (isCurrent) { stopAllAudio(); status.textContent = 'Tap something to open'; return; }
      stopAllAudio();
      isCurrent = true;
      playingInstance = inst;
      window.radioViz.current = btnEl;
      clickToken++;
      status.textContent = 'Connecting to ' + displayName + '\u2026';
      if (syncState === 'plain') { vizMode = 'plain'; setViz('plain', false, null); startPlain(); }
      else { vizMode = 'sync'; setViz('sync', false, analyser); attemptSync(); }
    });
    var inst = { stop: stop };
    return inst;
  }

  instances.push(makeAudio(document.getElementById('edge')));
  instances.push(makeAudio(document.getElementById('hot97')));
})();
</script>

<script>
(function () {
  function makeViz(btnEl, stops) {
    var c = document.createElement('canvas');
    c.className = 'viz';
    btnEl.appendChild(c);
    var ctx = c.getContext('2d');
    var dpr = 1, w = 0, h = 0, cur = [];
    function sizeIt() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = btnEl.clientWidth;
      h = btnEl.clientHeight;
      if (!w || !h) return;
      c.width = Math.round(w * dpr);
      c.height = Math.round(h * dpr);
      cur = [];
    }
    sizeIt();
    window.addEventListener('resize', sizeIt);
    window.addEventListener('load', sizeIt);
    var BAR_N = 20;
    var freqData = null;
    function draw() {
      requestAnimationFrame(draw);
      var viz = window.radioViz || {};
      var t = performance.now() / 1000;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      var active = (viz.current === btnEl && viz.playing);
      if (!active) return;
      var analyser = (viz.mode === 'sync') ? viz.analyser : null;
      if (analyser) {
        if (!freqData || freqData.length !== analyser.frequencyBinCount) freqData = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(freqData);
      }
      var step = w / BAR_N;
      var bw = step * 0.62;
      var grad = ctx.createLinearGradient(0, h, 0, 0);
      grad.addColorStop(0, stops[0]);
      grad.addColorStop(0.6, stops[1]);
      grad.addColorStop(1, stops[2]);
      ctx.fillStyle = grad;
      for (var b = 0; b < BAR_N; b++) {
        var target;
        if (analyser && freqData) {
          var bin = Math.floor(b * freqData.length / BAR_N);
          target = 0.08 + (freqData[bin] / 255) * (h * 0.72);
        } else {
          var beat = Math.pow(Math.max(0, Math.sin(t * 2.1)), 3);
          target = h * 0.08 + (0.5 + 0.5 * Math.sin(t * 2.6 + b * 0.55)) * (h * 0.28 + beat * h * 0.35);
        }
        var v = cur[b] || 0;
        v += (target - v) * 0.35;
        cur[b] = v;
        var x = b * step + (step - bw) / 2;
        var hh = Math.max(2, v);
        ctx.fillRect(x, h - hh, bw, hh);
      }
    }
    draw();
  }
  makeViz(document.getElementById('edge'), ['#0f2a4a', '#2f7de1', '#7cc4ff']);
  makeViz(document.getElementById('hot97'), ['#2a1200', '#ff7a29', '#ffc27a']);
})();
</script>

<script>
(function () {
  var status = document.getElementById('status');
  function stopAudio() { try { if (window.jlStopAudio) window.jlStopAudio(); } catch (e) {} }
  function makeCard(suffix, name) {
    return {
      suffix: suffix, name: name, liveMode: false,
      card: document.getElementById('yt-card-' + suffix),
      liveBtn: document.getElementById('yt-live-btn-' + suffix),
      liveBtnText: document.getElementById('yt-live-btn-text-' + suffix),
      mainFrame: document.getElementById('yt-player-' + suffix),
      liveFrame: document.getElementById('yt-player-live-' + suffix),
      latestPlayer: null, livePlayer: null
    };
  }
  var cards = [makeCard('tg', 'Typical Gamer'), makeCard('nw', 'NoahWPlays')];
  function pauseCard(c) {
    try { if (c.latestPlayer && c.latestPlayer.pauseVideo) c.latestPlayer.pauseVideo(); } catch (e) {}
    try { if (c.livePlayer && c.livePlayer.pauseVideo) c.livePlayer.pauseVideo(); } catch (e) {}
  }
  function pauseAllVideos() { for (var i = 0; i < cards.length; i++) pauseCard(cards[i]); }
  function showLatest(c) {
    c.liveMode = false;
    pauseCard(c);
    if (c.liveFrame) c.liveFrame.style.display = 'none';
    if (c.mainFrame) c.mainFrame.style.display = 'block';
    if (c.liveBtn) c.liveBtn.classList.remove('live-mode');
    if (c.liveBtnText) c.liveBtnText.textContent = 'Check if live';
    if (c.card) c.card.classList.remove('playing');
    status.textContent = 'Tap something to open';
  }
  function revertAllCards() { for (var i = 0; i < cards.length; i++) showLatest(cards[i]); }
  window.jlPauseVideos = pauseAllVideos;
  window.jlRevertCards = revertAllCards;
  function showLive(c) {
    for (var i = 0; i < cards.length; i++) { if (cards[i] !== c) showLatest(cards[i]); }
    stopAudio();
    c.liveMode = true;
    try { if (c.latestPlayer && c.latestPlayer.pauseVideo) c.latestPlayer.pauseVideo(); } catch (e) {}
    if (c.mainFrame) c.mainFrame.style.display = 'none';
    if (c.liveFrame) c.liveFrame.style.display = 'block';
    if (c.liveBtn) c.liveBtn.classList.add('live-mode');
    if (c.liveBtnText) c.liveBtnText.textContent = 'Back to latest';
    if (c.card) c.card.classList.remove('playing');
    status.textContent = 'Live feed — tap play to watch';
    try { if (c.livePlayer && c.livePlayer.playVideo) c.livePlayer.playVideo(); } catch (e) {}
  }
  for (var j = 0; j < cards.length; j++) {
    (function (c) {
      if (c.liveBtn) {
        c.liveBtn.addEventListener('click', function (e) {
          if (e && e.stopPropagation) e.stopPropagation();
          if (!c.liveMode) { showLive(c); }
          else { showLatest(c); }
        });
      }
    })(cards[j]);
  }
  window.onYouTubeIframeAPIReady = function () {
    try {
      for (var k = 0; k < cards.length; k++) {
        (function (c) {
          var handler = function (e) {
            if (e.data === YT.PlayerState.PLAYING) {
              stopAudio();
              for (var m = 0; m < cards.length; m++) { if (cards[m] !== c) showLatest(cards[m]); }
              if (c.card) c.card.classList.add('playing');
              status.textContent = 'Watching: ' + c.name;
              try { if (window.__my10track) window.__my10track.mediaStart(c.name); } catch (err2) {}
            } else {
              if (e.data === YT.PlayerState.PAUSED || e.data === YT.PlayerState.ENDED) {
                try { if (window.__my10track) window.__my10track.mediaStop(c.name); } catch (err2) {}
              }
              if (c.card) { c.card.classList.remove('playing'); }
            }
          };
          c.latestPlayer = new YT.Player('yt-player-' + c.suffix, { events: { 'onStateChange': handler } });
          c.livePlayer = new YT.Player('yt-player-live-' + c.suffix, { events: { 'onStateChange': handler } });
        })(cards[k]);
      }
    } catch (err) {}
  };
})();
</script>

<script>
/* My 10 usage tracking: first-party, anonymous aggregate counts only.
   Page slug is set per page at build time. Sends visit / click / share /
   media-seconds / visible-seconds to Brad's own collector. Never blocks
   the page: every call is guarded, failures are silent, and no listener
   here calls preventDefault (mailto and link taps still fire normally). */
(function () {
  try {
    var SLUG = 'brad-links';
    var ENDPOINT = 'https://ucii.sportgen-ai.com/track/event';
    var session = null;
    try {
      session = sessionStorage.getItem('my10-track-session');
      if (!session) {
        session = 's' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        sessionStorage.setItem('my10-track-session', session);
      }
    } catch (e) { session = 's' + Math.random().toString(36).slice(2); }
    function send(type, item, seconds, ref) {
      try {
        var payload = JSON.stringify({ type: type, page: SLUG, session: session,
          item: item || null,
          seconds: (seconds == null ? null : Math.round(seconds * 10) / 10),
          ref: ref || null });
        // fetch with keepalive + credentials omitted: the collector's CORS
        // answers "*" which a credentialed beacon (sendBeacon) rejects,
        // so beacons never arrive. keepalive survives pagehide like a
        // beacon, without the credential trap. No fetch, no send.
        if (window.fetch) {
          fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: payload, keepalive: true, credentials: 'omit' }).catch(function () {});
        }
      } catch (e) {}
    }
    var mediaOpen = {};
    var mediaPending = {};
    var pagePending = 0;
    var visibleSince = (document.visibilityState === 'visible') ? Date.now() : null;
    function mediaStart(item) { try { if (!mediaOpen[item]) mediaOpen[item] = Date.now(); } catch (e) {} }
    function mediaStop(item) {
      try {
        var t = mediaOpen[item];
        if (t) { mediaPending[item] = (mediaPending[item] || 0) + (Date.now() - t) / 1000; delete mediaOpen[item]; }
      } catch (e) {}
    }
    function flush() {
      try {
        var now = Date.now();
        for (var item in mediaOpen) {
          mediaPending[item] = (mediaPending[item] || 0) + (now - mediaOpen[item]) / 1000;
          mediaOpen[item] = now;
        }
        for (var m in mediaPending) { if (mediaPending[m] > 0) send('media', m, mediaPending[m]); }
        mediaPending = {};
        if (visibleSince) { pagePending += (now - visibleSince) / 1000; visibleSince = now; }
        if (pagePending > 0) send('page', null, pagePending);
        pagePending = 0;
      } catch (e) {}
    }
    function flushFinal() {
      try {
        var now = Date.now();
        for (var item in mediaOpen) {
          mediaPending[item] = (mediaPending[item] || 0) + (now - mediaOpen[item]) / 1000;
        }
        mediaOpen = {};
        for (var m in mediaPending) { if (mediaPending[m] > 0) send('media', m, mediaPending[m]); }
        if (visibleSince) { pagePending += (now - visibleSince) / 1000; }
        if (pagePending > 0) send('page', null, pagePending);
      } catch (e) {}
    }
    window.__my10track = { mediaStart: mediaStart, mediaStop: mediaStop };
    try {
      var refHost = null;
      if (document.referrer) {
        var a = document.createElement('a');
        a.href = document.referrer;
        refHost = a.hostname || null;
      }
      send('visit', null, null, refHost);
    } catch (e) { try { send('visit', null, null, null); } catch (e2) {} }
    function bindClick(sel, getItem, type) {
      try {
        var els = document.querySelectorAll(sel);
        for (var i = 0; i < els.length; i++) {
          (function (el) {
            el.addEventListener('click', function () { try { send(type || 'click', getItem(el)); } catch (e) {} });
          })(els[i]);
        }
      } catch (e) {}
    }
    bindClick('button.station.audio', function (el) { return el.getAttribute('data-name'); });
    bindClick('a.station', function (el) {
      var f = el.querySelector('.freq');
      return f ? f.textContent.trim() : 'link';
    });
    bindClick('.yt-link', function (el) {
      var card = el.closest('.yt-card');
      var l = card ? card.querySelector('.yt-card-label') : null;
      return l ? l.textContent.trim() : 'YouTube';
    });
    bindClick('.share-pill', function () { return 'Share'; }, 'share');
    bindClick('.contact-pill', function (el) {
      var h = el.getAttribute('href') || '';
      return (h.indexOf('mailto:') === 0) ? 'Contact Us' : el.textContent.trim();
    });
    document.addEventListener('visibilitychange', function () {
      try {
        if (document.visibilityState === 'hidden') {
          if (visibleSince) { pagePending += (Date.now() - visibleSince) / 1000; visibleSince = null; }
        } else { visibleSince = Date.now(); }
      } catch (e) {}
    });
    setInterval(flush, 60000);
    window.addEventListener('pagehide', flushFinal);
  } catch (e) {}
})();
</script>
